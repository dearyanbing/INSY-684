# Prometheus config: scrape the prediction API every 15 seconds.
# "api" is the service name in docker-compose.yml (Esteban's branch).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: churn-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
