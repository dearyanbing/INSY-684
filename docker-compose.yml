# Local stack: MLflow server, PostgreSQL (prediction log) and the prediction API.
# Evidently, Prometheus, Grafana, the frontend and the traffic simulator get added
# here as their branches land.
#
#   docker compose up -d --build --wait        start MLflow (http://localhost:5001) + PostgreSQL (localhost:5433)
#   docker compose --profile api up -d --build start MLflow + API (http://localhost:8000/docs)
#   docker compose logs -f                     follow logs
#   docker compose down                        stop (add -v to also delete MLflow data)
#
# Train against the MLflow server from your laptop:
#   MLFLOW_TRACKING_URI=http://localhost:5001 python -m churn.train
#
# Host port 5001 for MLflow because macOS AirPlay Receiver already uses 5000.

services:
  mlflow:
    build:
      context: .
      dockerfile: docker/mlflow.Dockerfile
    image: telco-churn-mlflow:latest
    command: >
      mlflow server
      --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts localhost,localhost:*,127.0.0.1,127.0.0.1:*,mlflow,mlflow:*
    ports:
      - "5001:5000"
    volumes:
      - mlflow-data:/mlflow
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: churn
      POSTGRES_PASSWORD: churn  # local development only
      POSTGRES_DB: churn
    ports:
      - "5433:5432"  # 5433 so it doesn't clash with a PostgreSQL already on your laptop
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Runs once, when the volume is empty: creates the predictions table.
      # After changing schema.sql, reset with `docker compose down -v`.
      - ./monitoring/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U churn -d churn"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    # Behind a profile until src/churn/api.py exists; remove `profiles` once it lands.
    profiles: ["api"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: telco-churn-api:latest
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      MODEL_URI: models:/telco-churn-classifier@champion
      DATABASE_URL: postgresql://churn:churn@postgres:5432/churn
    ports:
      - "8000:8000"
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  mlflow-data:
  postgres-data:
