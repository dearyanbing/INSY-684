name: CD

# Runs after the CI workflow finishes on main. Only publishes if CI passed,
# so an image never reaches the registry without unit + integration tests.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          # build exactly the commit CI tested
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push the MLflow image
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          IMAGE=$(echo "ghcr.io/${{ github.repository }}/mlflow" | tr '[:upper:]' '[:lower:]')
          docker build -f docker/mlflow.Dockerfile -t $IMAGE:latest -t $IMAGE:$SHA .
          docker push $IMAGE:latest
          docker push $IMAGE:$SHA

